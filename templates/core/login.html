{% extends 'core/base.html' %}
{% block title %}Login - Chama Smart{% endblock %}

{% block content %}
<section class="min-h-screen bg-gradient-to-br from-green-700 to-green-500 flex items-center justify-center px-4">
    <div class="bg-white rounded-2xl shadow-xl w-full max-w-md p-8">

        <div class="text-center mb-8">
            <div class="text-5xl mb-3">🌱</div>
            <h1 class="text-2xl font-bold text-gray-800">Welcome Back</h1>
            <p class="text-gray-500 mt-1">Login to your Chama Smart account</p>
        </div>

        <div id="errorMsg" class="hidden bg-red-50 border border-red-200 text-red-700 px-4 py-3 rounded-lg mb-4"></div>

        <div class="space-y-4">
            <div>
                <label class="block text-sm font-medium text-gray-700 mb-1">Phone Number</label>
                <input id="phone" type="tel" placeholder="e.g. 0712345678"
                    class="w-full border border-gray-300 rounded-lg px-4 py-3 focus:outline-none focus:ring-2 focus:ring-green-500">
            </div>
            <div>
                <label class="block text-sm font-medium text-gray-700 mb-1">Password</label>
                <input id="password" type="password" placeholder="Enter your password"
                    class="w-full border border-gray-300 rounded-lg px-4 py-3 focus:outline-none focus:ring-2 focus:ring-green-500">
            </div>
            <button onclick="login()"
                class="w-full bg-green-600 text-white py-3 rounded-lg font-semibold hover:bg-green-700 transition text-lg">
                Login
            </button>
        </div>

        <p class="text-center text-gray-500 mt-6">
            Don't have an account?
            <a href="/register/" class="text-green-600 font-semibold hover:underline">Register here</a>
        </p>
    </div>
</section>

<script>
async function login() {
    const phone = document.getElementById('phone').value;
    const password = document.getElementById('password').value;
    const errorMsg = document.getElementById('errorMsg');

    if (!phone || !password) {
        errorMsg.textContent = 'Please fill in all fields';
        errorMsg.classList.remove('hidden');
        return;
    }

    try {
        const response = await fetch('/api/accounts/login/', {
            method: 'POST',
            headers: {'Content-Type': 'application/json'},
            body: JSON.stringify({phone_number: phone, password})
        });
        const data = await response.json();

        if (response.ok) {
            localStorage.setItem('access_token', data.access);
            localStorage.setItem('refresh_token', data.refresh);
            window.location.href = '/dashboard/';
        } else {
            errorMsg.textContent = 'Invalid phone number or password';
            errorMsg.classList.remove('hidden');
        }
    } catch(e) {
        errorMsg.textContent = 'Connection error. Please try again.';
        errorMsg.classList.remove('hidden');
    }
}

// Allow Enter key to submit
document.addEventListener('keypress', function(e) {
    if (e.key === 'Enter') login();
});
</script>
{% endblock %}
