{% extends 'core/base_auth.html' %}
{% block title %}Loans - Chama Smart{% endblock %}
{% block page_title %}Loan Management{% endblock %}

{% block content %}
<div class="grid grid-cols-1 md:grid-cols-2 gap-6 mb-8">
    <div class="bg-white rounded-xl shadow-sm p-6">
        <h2 class="text-xl font-semibold mb-6">Apply for a Loan</h2>
        <div id="applyError" class="hidden bg-red-50 border border-red-200 text-red-700 px-4 py-3 rounded-lg mb-4"></div>
        <div id="applySuccess" class="hidden bg-green-50 border border-green-200 text-green-700 px-4 py-3 rounded-lg mb-4"></div>
        <div class="space-y-4">
            <div>
                <label class="block text-sm font-medium text-gray-700 mb-1">Select Chama</label>
                <select id="loanChama" class="w-full border rounded-lg px-4 py-3 focus:outline-none focus:ring-2 focus:ring-green-500">
                    <option value="">Loading...</option>
                </select>
            </div>
            <div>
                <label class="block text-sm font-medium text-gray-700 mb-1">Amount (KES)</label>
                <input id="loanAmount" type="number" placeholder="e.g. 5000"
                    class="w-full border rounded-lg px-4 py-3 focus:outline-none focus:ring-2 focus:ring-green-500">
            </div>
            <div>
                <label class="block text-sm font-medium text-gray-700 mb-1">Purpose</label>
                <textarea id="loanPurpose" placeholder="What will you use the loan for?"
                    class="w-full border rounded-lg px-4 py-3 focus:outline-none focus:ring-2 focus:ring-green-500 h-20"></textarea>
            </div>
            <div>
                <label class="block text-sm font-medium text-gray-700 mb-1">Repayment Period</label>
                <select id="loanPeriod" class="w-full border rounded-lg px-4 py-3 focus:outline-none focus:ring-2 focus:ring-green-500">
                    <option value="1">1 Month</option>
                    <option value="3" selected>3 Months</option>
                    <option value="6">6 Months</option>
                    <option value="12">12 Months</option>
                </select>
            </div>
            <button onclick="applyLoan()"
                class="w-full bg-green-600 text-white py-3 rounded-lg font-semibold hover:bg-green-700 transition">
                Submit Application
            </button>
        </div>
    </div>

    <div class="bg-white rounded-xl shadow-sm p-6">
        <h2 class="text-xl font-semibold mb-6">My Credit Score</h2>
        <div id="creditInfo" class="text-center py-4"><p class="text-gray-400">Loading...</p></div>
    </div>
</div>

<div class="bg-white rounded-xl shadow-sm p-6">
    <h2 class="text-xl font-semibold mb-6">My Loan History</h2>
    <div id="loanHistory"><p class="text-gray-400 text-center py-8">Loading...</p></div>
</div>
{% endblock %}

{% block scripts %}
<script>
async function loadLoansPage() {
    const chamas = await apiCall('/api/chamas/my/');
    const select = document.getElementById('loanChama');
    if (chamas && chamas.length > 0) {
        select.innerHTML = chamas.map(m => `<option value="${m.chama.id}">${m.chama.name}</option>`).join('');
    } else {
        select.innerHTML = '<option value="">Join a chama first</option>';
    }

    const score = await apiCall('/api/analytics/score/');
    if (score) {
        const color = score.risk_level === 'low' ? 'text-green-600' : score.risk_level === 'medium' ? 'text-yellow-500' : 'text-red-500';
        document.getElementById('creditInfo').innerHTML = `
            <div class="text-7xl font-bold ${color} mb-2">${score.credit_score}</div>
            <p class="text-gray-400 mb-4">out of 100</p>
            <span class="px-4 py-2 rounded-full text-sm font-semibold ${
                score.risk_level === 'low' ? 'bg-green-100 text-green-700' :
                score.risk_level === 'medium' ? 'bg-yellow-100 text-yellow-700' :
                'bg-red-100 text-red-700'}">${score.recommendation.toUpperCase()} · ${score.risk_level.toUpperCase()} RISK</span>
            <div class="mt-6 text-left space-y-2">
                ${score.how_to_improve.map(tip => `
                    <div class="flex items-start space-x-2 text-sm text-gray-600">
                        <span class="text-green-500 mt-0.5">→</span><span>${tip}</span>
                    </div>`).join('')}
            </div>`;
    }

    const loans = await apiCall('/api/loans/my/');
    const historyEl = document.getElementById('loanHistory');
    if (loans && loans.length > 0) {
        historyEl.innerHTML = `<div class="overflow-x-auto"><table class="w-full text-sm">
            <thead><tr class="text-left text-gray-400 border-b">
                <th class="pb-3">Chama</th><th class="pb-3">Amount</th>
                <th class="pb-3">Purpose</th><th class="pb-3">ML Score</th>
                <th class="pb-3">Status</th><th class="pb-3">Applied</th>
            </tr></thead>
            <tbody>${loans.map(l => `
                <tr class="border-b border-gray-50 hover:bg-gray-50">
                    <td class="py-3 font-medium">${l.chama_name}</td>
                    <td class="py-3">KES ${parseInt(l.amount_requested).toLocaleString()}</td>
                    <td class="py-3 text-gray-500">${l.purpose.substring(0, 25)}...</td>
                    <td class="py-3">${l.ml_credit_score || '--'}</td>
                    <td class="py-3"><span class="px-2 py-1 rounded-full text-xs ${
                        l.status === 'approved' ? 'bg-green-100 text-green-700' :
                        l.status === 'pending' ? 'bg-yellow-100 text-yellow-700' :
                        l.status === 'rejected' ? 'bg-red-100 text-red-700' :
                        'bg-blue-100 text-blue-700'}">${l.status}</span></td>
                    <td class="py-3 text-gray-400">${new Date(l.applied_at).toLocaleDateString()}</td>
                </tr>`).join('')}
            </tbody></table></div>`;
    } else {
        historyEl.innerHTML = '<p class="text-gray-400 text-center py-8">No loan applications yet</p>';
    }
}

async function applyLoan() {
    const chamaId = document.getElementById('loanChama').value;
    const amount = document.getElementById('loanAmount').value;
    const purpose = document.getElementById('loanPurpose').value;
    const period = document.getElementById('loanPeriod').value;
    const errorEl = document.getElementById('applyError');
    const successEl = document.getElementById('applySuccess');
    if (!chamaId || !amount || !purpose) {
        errorEl.textContent = 'Please fill in all fields';
        errorEl.classList.remove('hidden');
        return;
    }
    const result = await apiCall(`/api/loans/chama/${chamaId}/apply/`, 'POST', {
        amount_requested: amount, purpose, repayment_period_months: period
    });
    if (result && result.loan) {
        successEl.textContent = `Application submitted! ML Score: ${result.ml_info.your_credit_score} · Recommendation: ${result.ml_info.recommendation}`;
        successEl.classList.remove('hidden');
        errorEl.classList.add('hidden');
        loadLoansPage();
    } else {
        errorEl.textContent = result?.error || JSON.stringify(result);
        errorEl.classList.remove('hidden');
    }
}

loadLoansPage();
</script>
{% endblock %}
