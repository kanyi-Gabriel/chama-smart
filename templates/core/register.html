{% extends 'core/base.html' %}
{% block title %}Register - Chama Smart{% endblock %}

{% block content %}
<section class="min-h-screen bg-gradient-to-br from-green-700 to-green-500 flex items-center justify-center px-4 py-12">
    <div class="bg-white rounded-2xl shadow-xl w-full max-w-md p-8">

        <div class="text-center mb-8">
            <div class="text-5xl mb-3">🌱</div>
            <h1 class="text-2xl font-bold text-gray-800">Create Account</h1>
            <p class="text-gray-500 mt-1">Join Chama Smart today</p>
        </div>

        <div id="errorMsg" class="hidden bg-red-50 border border-red-200 text-red-700 px-4 py-3 rounded-lg mb-4"></div>
        <div id="successMsg" class="hidden bg-green-50 border border-green-200 text-green-700 px-4 py-3 rounded-lg mb-4"></div>

        <div class="space-y-4">
            <div class="grid grid-cols-2 gap-4">
                <div>
                    <label class="block text-sm font-medium text-gray-700 mb-1">First Name</label>
                    <input id="firstName" type="text" placeholder="Gabriel"
                        class="w-full border border-gray-300 rounded-lg px-4 py-3 focus:outline-none focus:ring-2 focus:ring-green-500">
                </div>
                <div>
                    <label class="block text-sm font-medium text-gray-700 mb-1">Last Name</label>
                    <input id="lastName" type="text" placeholder="Kanyi"
                        class="w-full border border-gray-300 rounded-lg px-4 py-3 focus:outline-none focus:ring-2 focus:ring-green-500">
                </div>
            </div>
            <div>
                <label class="block text-sm font-medium text-gray-700 mb-1">Phone Number</label>
                <input id="phone" type="tel" placeholder="0712345678"
                    class="w-full border border-gray-300 rounded-lg px-4 py-3 focus:outline-none focus:ring-2 focus:ring-green-500">
            </div>
            <div>
                <label class="block text-sm font-medium text-gray-700 mb-1">Email Address</label>
                <input id="email" type="email" placeholder="gabriel@example.com"
                    class="w-full border border-gray-300 rounded-lg px-4 py-3 focus:outline-none focus:ring-2 focus:ring-green-500">
            </div>
            <div>
                <label class="block text-sm font-medium text-gray-700 mb-1">ID Number</label>
                <input id="idNumber" type="text" placeholder="National ID number"
                    class="w-full border border-gray-300 rounded-lg px-4 py-3 focus:outline-none focus:ring-2 focus:ring-green-500">
            </div>
            <div>
                <label class="block text-sm font-medium text-gray-700 mb-1">Password</label>
                <input id="password" type="password" placeholder="Create a strong password"
                    class="w-full border border-gray-300 rounded-lg px-4 py-3 focus:outline-none focus:ring-2 focus:ring-green-500">
            </div>
            <div>
                <label class="block text-sm font-medium text-gray-700 mb-1">Confirm Password</label>
                <input id="password2" type="password" placeholder="Repeat your password"
                    class="w-full border border-gray-300 rounded-lg px-4 py-3 focus:outline-none focus:ring-2 focus:ring-green-500">
            </div>
            <button onclick="register()"
                class="w-full bg-green-600 text-white py-3 rounded-lg font-semibold hover:bg-green-700 transition text-lg">
                Create Account
            </button>
        </div>

        <p class="text-center text-gray-500 mt-6">
            Already have an account?
            <a href="/login/" class="text-green-600 font-semibold hover:underline">Login here</a>
        </p>
    </div>
</section>

<script>
async function register() {
    const data = {
        first_name: document.getElementById('firstName').value,
        last_name: document.getElementById('lastName').value,
        phone_number: document.getElementById('phone').value,
        email: document.getElementById('email').value,
        id_number: document.getElementById('idNumber').value,
        password: document.getElementById('password').value,
        password2: document.getElementById('password2').value,
    };

    const errorMsg = document.getElementById('errorMsg');
    const successMsg = document.getElementById('successMsg');

    try {
        const response = await fetch('/api/accounts/register/', {
            method: 'POST',
            headers: {'Content-Type': 'application/json'},
            body: JSON.stringify(data)
        });
        const result = await response.json();

        if (response.ok) {
            localStorage.setItem('access_token', result.tokens.access);
            localStorage.setItem('refresh_token', result.tokens.refresh);
            successMsg.textContent = 'Account created! Redirecting...';
            successMsg.classList.remove('hidden');
            setTimeout(() => window.location.href = '/dashboard/', 1500);
        } else {
            const errors = Object.values(result).flat().join(' ');
            errorMsg.textContent = errors;
            errorMsg.classList.remove('hidden');
        }
    } catch(e) {
        errorMsg.textContent = 'Connection error. Please try again.';
        errorMsg.classList.remove('hidden');
    }
}
</script>
{% endblock %}
